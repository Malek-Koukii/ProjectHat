<div class="main">
  <div class="col-lg-9 left-section">
    <app-navbar></app-navbar>
    <div class="py-5">
      <div style="position: relative">
        <div class="container bloc">
          <div class="d-flex justify-content-center">
            <div class="design-left">
              <img src="assets/imgs/design.png" alt="" />
            </div>
            <div class="contact-form card border-0 rounded-0">
              <h3 id="contactTab">Contact us</h3>
              <form>
                <div class="form-group">
                  <input
                    type="text"
                    class="form-control"
                    placeholder="Name & Surname"
                    id="name"
                  />
                </div>
                <div class="form-group">
                  <input
                    type="email"
                    class="form-control"
                    placeholder="Email"
                    id="email"
                  />
                </div>
                <div class="form-group">
                  <input
                    type="text"
                    class="form-control"
                    placeholder="Subject"
                    id="subject"
                  />
                </div>
                <div class="form-group">
                  <textarea
                    class="form-control"
                    id="message"
                    rows="2"
                    placeholder="Message"
                  ></textarea>
                </div>
                <div class="mt-4 justify-content-center text-center">
                  <button
                    type="submit"
                    class="submitBtn"
                    style="cursor: pointer"
                  >
                    <img
                      src="assets/imgs/contact.png"
                      class="submitImg"
                      alt=""
                    />
                    <div class="btn-body d-flex">
                      <img
                        src="assets/imgs/circle-arrows.png"
                        class="mx-1"
                        alt=""
                      />
                      <p id="submit">Submit</p>
                    </div>
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="col-lg-3 right-section">
    <div class="contact-content">
      <img src="assets/imgs/right.png" class="design-right" alt="" />
      <div class="container pt-4 pb-5">
        <div class="d-flex mt-4 justifiy-content-center text-center">
          <div class="card contact-card" style="width: 100%">
            <div class="addressImg text-center">
              <i class="material-icons">home</i>
            </div>
            <div class="card-body contact-text">
              <h5 id="addressContact">Address</h5>
              <div class="card-text" id="addressText1">
                Sanwen Center, 7 Avenue Habib Bourguiba
              </div>
              <div class="card-text" id="addressText2">The Bardo, Tunis.</div>
            </div>
          </div>
        </div>
        <div class="d-flex mt-4 justifiy-content-center text-center">
          <div class="card contact-card" style="width: 100%">
            <div class="contactImg text-center">
              <i class="material-icons">mail</i>
            </div>
            <div class="card-body contact-text">
              <h5 id="emailContact">Email</h5>
              <div class="card-text">Contact@hatlone.com</div>
            </div>
          </div>
        </div>
        <div class="d-flex mt-4 justifiy-content-center text-center">
          <div class="card contact-card" style="width: 100%">
            <div class="phoneIcon text-center">
              <i class="bi bi-telephone-fill"></i>
            </div>
            <div class="card-body contact-text">
              <h5 class="card-title" id="phone">Phone</h5>
              <p class="card-text">+21653366352</p>
            </div>
          </div>
        </div>
        <div class="socialIcons mt-4">
          <p id="socialMedia">Follow us on social media</p>
          <div class="d-flex justify-content-center">
            <img src="assets/imgs/facebook.png" alt="" />
            <img
              style="margin: 0 10px"
              src="assets/imgs/instagram.png"
              alt=""
            />
            <img src="assets/imgs/linkedin.png" alt="" />
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
